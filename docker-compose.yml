services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee-directory-app
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-production_jwt_secret_key_2026}
      - CORS_ORIGIN=http://localhost:4000
      - DB_PATH=/app/server/data/database.sqlite
    volumes:
      - sqlite_data:/app/server/data
    restart: unless-stopped

volumes:
  sqlite_data:
